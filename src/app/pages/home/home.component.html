<hero></hero>

@if (activeNotices.length > 0) {
  <section class="section-padding nav-section">
    <div class="container">
      <p class="text-primary font-lg-25 fw-bold mb-3 d-block"><strong>Aktuelles!</strong></p>
      @for (notice of activeNotices; track notice.id) {
        <div class="mb-3">
          <latest-news [blocks]="notice.content"
                       [title]="notice.title"
                       [startDate]="notice.startDate"
                       [endDate]="notice.endDate">
          </latest-news>
        </div>
      }
    </div>
  </section>
}
