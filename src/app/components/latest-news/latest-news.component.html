
<div class="owl-item">
    <figure class="reviews-thumb d-flex flex-wrap align-items-center"
        style="background: #fff;border: 2px solid var(--bs-blue);padding: 16px;">

        @if (title) {
            <p class="text-primary d-block mt-1 mb-2 w-100 font-sm-18 fw-bold">{{ renderedTitle }}</p>
        }

        @if (renderedHtml) {
            <div class="w-100" [innerHTML]="renderedHtml"></div>
        }
    </figure>
</div>
